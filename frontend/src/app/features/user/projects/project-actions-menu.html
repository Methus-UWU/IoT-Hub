<button
  #trigger
  type="button"
  class="menu-trigger"
  [attr.aria-label]="'ตัวเลือกเพิ่มเติมของ ' + project().name"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? 'project-actions-menu-' + project().id : null"
  (click)="toggle()"
>
  <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
    <circle cx="10" cy="4" r="1.2" />
    <circle cx="10" cy="10" r="1.2" />
    <circle cx="10" cy="16" r="1.2" />
  </svg>
</button>

@if (open()) {
  <div
    #menu
    popover="manual"
    [id]="'project-actions-menu-' + project().id"
    class="actions-menu"
    role="menu"
    [attr.aria-label]="'การจัดการ ' + project().name"
    [style.top.px]="menuPosition().top"
    [style.left.px]="menuPosition().left"
    [style.width.px]="menuPosition().width"
  >
    <a
      class="menu-item"
      role="menuitem"
      [routerLink]="['/user/projects', project().id, 'ide']"
      (click)="closeMenu()"
    >
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path
          d="m7.5 7-3 3 3 3M12.5 7l3 3-3 3"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      เปิด IDE
    </a>
    <a
      class="menu-item"
      role="menuitem"
      [routerLink]="['/user/projects', project().id, 'virtual-device']"
      (click)="closeMenu()"
    >
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect
          x="3.5"
          y="4.5"
          width="13"
          height="9"
          rx="1.2"
          stroke="currentColor"
          stroke-width="1.4"
        />
        <path d="M7.5 16.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      </svg>
      เปิดอุปกรณ์จำลอง
    </a>

    @if (actions.canDelete()) {
      <hr />
      <button
        class="menu-item menu-item-danger"
        type="button"
        role="menuitem"
        (click)="startDelete()"
      >
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path
            d="M4.5 6h11M8 6V4.5h4V6M6 6l.7 9.2a1 1 0 0 0 1 .8h4.6a1 1 0 0 0 1-.8L14 6"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        ลบโปรเจกต์…
      </button>
    }
  </div>
}

@if (confirming()) {
  <dialog
    #confirmDialog
    class="confirm-dialog"
    aria-labelledby="delete-project-title"
    aria-describedby="delete-project-description"
    (cancel)="cancelConfirm($event)"
  >
    <h2 id="delete-project-title">ลบโปรเจกต์?</h2>
    <p class="project-name">{{ project().name }}</p>
    <p id="delete-project-description">
      การลบจะเอาโปรเจกต์ ไฟล์ที่บันทึกไว้ อุปกรณ์ และการเชื่อมต่อทั้งหมดออกอย่างถาวร และกู้คืนไม่ได้
    </p>
    @if (actions.error(); as error) {
      <p class="error" role="alert">{{ error }}</p>
    }
    <div class="confirmation-actions">
      <button
        #cancelButton
        type="button"
        class="confirm-button"
        [disabled]="actions.pending()"
        (click)="closeConfirm()"
      >
        ยกเลิก
      </button>
      <button
        type="button"
        class="confirm-button confirm-button-danger"
        [disabled]="actions.pending() || !actions.canDelete()"
        (click)="deleteProject()"
      >
        {{ actions.pending() ? 'กำลังลบ…' : 'ลบโปรเจกต์ถาวร' }}
      </button>
    </div>
  </dialog>
}
