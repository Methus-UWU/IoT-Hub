<div
  class="relative grid min-h-full place-items-center overflow-hidden bg-surface-soft lg:h-full"
>
  <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
    <div
      class="animate-blob absolute -left-40 -top-48 h-96 w-96 rounded-full bg-primary-light/18 blur-3xl"
    ></div>
    <div
      class="animate-blob-slow absolute -right-32 top-1/4 h-96 w-96 rounded-full bg-[#afafaf]/30 blur-3xl"
    ></div>
    <div class="hero-grid absolute inset-x-0 bottom-0 h-2/3 opacity-45"></div>
  </div>

  <section
    class="relative mx-auto grid w-full max-w-7xl grid-cols-1 items-center gap-12 px-4 py-12 sm:px-6 lg:grid-cols-2 lg:gap-14 lg:px-8 lg:py-10"
  >
    <div>
      <div
        class="animate-fade-up inline-flex items-center gap-2 rounded-full border border-[#e1e1e1] bg-white px-3.5 py-1.5 text-xs font-semibold text-primary shadow-sm"
      >
        <svg viewBox="0 0 24 24" fill="none" class="h-3.5 w-3.5" aria-hidden="true">
          <path
            d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        แพลตฟอร์มความรู้ IoT
      </div>

      <h1
        class="animate-fade-up mt-6 font-display text-4xl leading-[1.25] font-bold tracking-[-0.01em] text-primary-dark sm:text-5xl lg:text-6xl"
        style="animation-delay: 80ms"
      >
        เว็บไซต์ช่วยเหลือ
        <span
          class="text-shimmer block bg-linear-to-r from-primary-dark via-primary-light/80 to-primary-dark bg-clip-text text-transparent"
        >
          นักพัฒนาระบบ IoT
        </span>
      </h1>

      <p
        class="animate-fade-up mt-6 max-w-xl text-base leading-relaxed text-primary sm:text-lg"
        style="animation-delay: 160ms"
      >
        ศูนย์รวมสำหรับการพัฒนา IoT — คลังความรู้ที่จัดเป็นระบบ คำแนะนำจากผู้เชี่ยวชาญ และแชทบอท AI
        ที่ช่วยให้โปรเจกต์ของคุณเดินหน้าได้เร็วขึ้น
      </p>

      <div
        class="animate-fade-up mt-8 flex flex-wrap items-center gap-3"
        style="animation-delay: 240ms"
      >
        <a
          routerLink="/auth/signup"
          class="rounded-xl border border-[#afafaf] bg-white/70 px-6 py-3 text-sm font-semibold text-primary-dark transition-all duration-200 hover:-translate-y-0.5 hover:border-primary hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-dark"
        >
          ทดลองใช้ AI Chatbot
        </a>
      </div>
    </div>

    <div class="animate-fade-up relative" style="animation-delay: 200ms">
      <div
        class="animate-float relative rounded-3xl border border-[#e1e1e1] bg-white/85 p-6 shadow-2xl shadow-black/8 backdrop-blur-xl"
      >
        <div class="flex items-center gap-1.5" aria-hidden="true">
          <span class="h-3 w-3 rounded-full bg-primary-light"></span>
          <span class="h-3 w-3 rounded-full bg-[#afafaf]"></span>
          <span class="h-3 w-3 rounded-full bg-[#e1e1e1]"></span>
        </div>

        <div class="mt-6 space-y-2.5" aria-hidden="true">
          <div class="h-2.5 w-3/4 rounded-full bg-[#e1e1e1]"></div>
          <div class="h-2.5 w-1/2 rounded-full bg-[#e1e1e1]"></div>
        </div>

        <div class="mt-6 grid grid-cols-[1fr_auto] gap-5">
          <div
            class="flex aspect-[4/3] items-center justify-center rounded-2xl bg-[#f1f1f1] text-primary"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24" fill="none" class="h-10 w-10">
              <path
                d="M4 8.5a12 12 0 0 1 16 0M7 12a7.5 7.5 0 0 1 10 0M10 15.3a3 3 0 0 1 4 0"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
              <circle cx="12" cy="18.3" r="1" fill="currentColor" />
            </svg>
          </div>
          <div class="flex w-40 flex-col justify-center gap-3" aria-hidden="true">
            <div class="h-2.5 rounded-full bg-[#e1e1e1]"></div>
            <div class="h-2.5 rounded-full bg-primary"></div>
            <div class="h-2.5 w-2/3 rounded-full bg-[#e1e1e1]"></div>
            <div class="h-2.5 w-4/5 rounded-full bg-[#e1e1e1]"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
