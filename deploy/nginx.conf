worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # Exclude query strings, which can contain authentication callback codes.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    # Re-resolve after an API container replacement, without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream nestjs_backend {
        zone nestjs_backend 64k;
        server nestjs:3000 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name unity-hub.connectdb.xyz;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # Build-dispatcher routes are reached over the private Docker network
        # only; the worker token guards them as well.
        location ^~ /api/internal/ {
            return 404;
        }

        location ~ ^/api(?:/|$) {
            proxy_pass http://nestjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 240s;
            proxy_send_timeout 240s;
            proxy_buffering off;
        }

        location ~ /\. {
            return 404;
        }
        location ~* \.(?:map|ts)$ {
            return 404;
        }
        location ~* "-[a-z0-9_-]{8,}\.(?:js|css|woff2?|ttf)$" {
            try_files $uri =404;
            add_header Cache-Control 'public, max-age=31536000, immutable';
            add_header X-Content-Type-Options nosniff always;
        }
        location ~* \.(?:js|css|json|svg|png|jpe?g|gif|ico|webp|woff2?|ttf|wasm)$ {
            try_files $uri =404;
            add_header Cache-Control 'no-cache';
            add_header X-Content-Type-Options nosniff always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control 'no-cache, no-store, must-revalidate';
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
